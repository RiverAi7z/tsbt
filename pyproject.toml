[project]
name = "tsbt"
version = "0.1.0"
description = "Vectorized time-series signal backtester for Binance USD-M perpetuals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.20",
    "duckdb>=1.1",
    "zarr>=3.0",
    "bottleneck>=1.4",
    "numba>=0.60",
    "xy>=0.0.9,<0.1",
    "filelock>=3.12",
]

[project.scripts]
tsbt = "tsbt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsbt"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
